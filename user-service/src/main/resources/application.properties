spring.application.name=user-service

# ---- Server ----
server.port=${PORT:8081}

# ---- DataSource (PostgreSQL) ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reco}
spring.datasource.username=${DATABASE_USER:reco}
spring.datasource.password=${DATABASE_PASSWORD:reco_password}

# ---- JPA / Hibernate ----
# users schema を既定にする。entity は schema 修飾なしで定義できる
spring.jpa.properties.hibernate.default_schema=users
# DB スキーマを変更しない（init スクリプト / Flyway 主導）
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Flyway ----
# 現状は infra/postgres/init/*.sql がスキーマを作成。
# 将来 user-service 配下に Flyway migrations を作って enable=true に変更する。
spring.flyway.enabled=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ---- アプリ情報（/actuator/info で参照可能） ----
info.app.name=${spring.application.name}
info.app.description=RecoForeJP User Service
