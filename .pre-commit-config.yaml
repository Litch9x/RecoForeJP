# pre-commit: https://pre-commit.com
# git commit 時に自動でフォーマット・チェックを実行する
#
# 初回セットアップ（1回だけ）:
#   pip install pre-commit
#   pre-commit install
#
# 手動で全ファイル走査:
#   pre-commit run --all-files

repos:
  # ----------------------------------------------------------------------
  # ファイル衛生：空白・改行・YAML/JSON 構文・大きなファイル等
  # ----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-case-conflict

  # ----------------------------------------------------------------------
  # Python（ai-service / scripts）: Ruff = Lint + Format（Black + isort 統合）
  # ----------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ----------------------------------------------------------------------
  # JavaScript / TypeScript / JSON / YAML / Markdown: Prettier
  # （frontend と api-gateway 実装後に効力を発揮）
  # ----------------------------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, yaml, markdown, css, scss]
        exclude: |
          (?x)^(
            .*\.lock|
            package-lock\.json|
            pnpm-lock\.yaml
          )$
