spring.application.name=item-service

# ---- Server ----
server.port=${PORT:8082}

# ---- DataSource (PostgreSQL) ----
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reco}
spring.datasource.username=${DATABASE_USER:reco}
spring.datasource.password=${DATABASE_PASSWORD:reco_password}

# ---- JPA / Hibernate ----
# items schema を既定にする
spring.jpa.properties.hibernate.default_schema=items
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# MVP: OSIV を有効化して LazyInitializationException を回避する。
# 将来的には ItemService が DTO を返すように変更し、open-in-view=false に戻す。
spring.jpa.open-in-view=true

# ---- Flyway ----
# infra/postgres/init/*.sql が当面 schema を所有。将来 item-service 配下に移管。
spring.flyway.enabled=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# ---- アプリ情報 ----
info.app.name=${spring.application.name}
info.app.description=RecoForeJP Item Service
