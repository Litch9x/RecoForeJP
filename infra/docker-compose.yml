# RecoForeJP - ローカル開発環境
#
# 起動:           docker compose -f infra/docker-compose.yml up -d
# 状態確認:       docker compose -f infra/docker-compose.yml ps
# ログ表示:       docker compose -f infra/docker-compose.yml logs -f
# 停止:           docker compose -f infra/docker-compose.yml down
# データ削除:     docker compose -f infra/docker-compose.yml down -v
#
# 環境変数: infra/.env を参照（infra/.env.example をコピーして作成）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reco-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reco_password}
      POSTGRES_DB: ${POSTGRES_DB:-reco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-reco} -d ${POSTGRES_DB:-reco}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reco-net

  redis:
    image: redis:7-alpine
    container_name: reco-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # api-gateway (NestJS) — RECO-59 で追加
  # ----------------------------------------------------------------------
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: reco-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-in-prod}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-3600}
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # user-service (Spring Boot, Java 21) — RECO-65 で追加
  # ----------------------------------------------------------------------
  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: reco-user-service
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reco}
      DATABASE_USER: ${POSTGRES_USER:-reco}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-reco_password}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # item-service (Spring Boot, Java 21) — RECO-72 で追加
  # ----------------------------------------------------------------------
  item-service:
    build:
      context: ../item-service
      dockerfile: Dockerfile
    container_name: reco-item-service
    restart: unless-stopped
    environment:
      PORT: 8082
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reco}
      DATABASE_USER: ${POSTGRES_USER:-reco}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-reco_password}
    ports:
      - "${ITEM_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8082/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # ai-service (Python / FastAPI) — RECO-20 で追加
  # ----------------------------------------------------------------------
  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: reco-ai-service
    restart: unless-stopped
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reco}:${POSTGRES_PASSWORD:-reco_password}@postgres:5432/${POSTGRES_DB:-reco}
      REDIS_URL: redis://redis:6379
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # frontend (Next.js) — RECO-29 で追加
  # ----------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: reco-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      AI_SERVICE_URL: http://ai-service:8000
      API_GATEWAY_URL: http://api-gateway:3000
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3001/api/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - reco-net

volumes:
  postgres-data:
    name: reco-postgres-data
  redis-data:
    name: reco-redis-data

networks:
  reco-net:
    name: reco-net
    driver: bridge
