# RecoForeJP - ローカル開発環境
#
# 起動:           docker compose -f infra/docker-compose.yml up -d
# 状態確認:       docker compose -f infra/docker-compose.yml ps
# ログ表示:       docker compose -f infra/docker-compose.yml logs -f
# 停止:           docker compose -f infra/docker-compose.yml down
# データ削除:     docker compose -f infra/docker-compose.yml down -v
#
# 環境変数: infra/.env を参照（infra/.env.example をコピーして作成）

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: reco-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reco_password}
      POSTGRES_DB: ${POSTGRES_DB:-reco}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-reco} -d ${POSTGRES_DB:-reco}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reco-net

  redis:
    image: redis:7-alpine
    container_name: reco-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # api-gateway (NestJS) — RECO-59 で追加
  # ----------------------------------------------------------------------
  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: reco-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "${API_GATEWAY_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # user-service (Spring Boot, Java 21) — RECO-65 で追加
  # ----------------------------------------------------------------------
  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: reco-user-service
    restart: unless-stopped
    environment:
      PORT: 8081
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-reco}
      DATABASE_USER: ${POSTGRES_USER:-reco}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-reco_password}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - reco-net

  # ----------------------------------------------------------------------
  # 残りのアプリ層は各 Story で Dockerfile 作成後に追加:
  #   - item-service  (Spring Boot)   : Item Service Epic で追加
  #   - ai-service    (FastAPI)       : AI 推薦 Epic で追加
  #   - frontend      (Next.js)       : Frontend Epic で追加
  # ----------------------------------------------------------------------

volumes:
  postgres-data:
    name: reco-postgres-data
  redis-data:
    name: reco-redis-data

networks:
  reco-net:
    name: reco-net
    driver: bridge
